name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The OpenCode plugin tests (TestOpencodePluginVitest / ...TypeScript)
      # run the locally installed vitest/tsc and never fetch on the fly, so
      # the plugin's dev dependencies must be present before `go test`.
      - name: Install OpenCode plugin deps
        run: npm ci
        working-directory: pkg/provider/plugins

      - name: Test
        run: go test ./...

      - name: Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest && staticcheck ./...

  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Install plugin test dependencies
        run: npm ci
        working-directory: pkg/provider/plugins
      - name: Portable plugin regression tests
        run: go test ./pkg/provider -run 'TestOpencode(InstallHooks|UninstallHooks|IsHooksInstalled|Plugin)' -count=1 -timeout 120s
      - name: Windows stop regression tests
        run: go test ./pkg/daemon -run '^TestWindowsStop' -count=1 -timeout 30s
      - name: Windows executable installation
        run: go test ./cmd -run '^TestInstallPreservesPlatformExecutableName$' -count=1 -timeout 30s
      - name: Process and SQLite fixtures
        run: go test ./pkg/process ./pkg/opencodetest -count=1 -timeout 60s
      - name: Git subprocess console regression
        run: go test ./pkg/git -count=1 -timeout 120s
      - name: Static analysis
        run: go vet ./...
      - name: Build portable ZIP
        run: ./scripts/build-windows-portable.ps1
      - name: Test extracted ZIP without PATH
        run: |
          Expand-Archive -LiteralPath dist/confab_dev_windows_amd64.zip -DestinationPath dist/extracted
          $env:CONFAB_PORTABLE_BINARY = (Resolve-Path dist/extracted/confab.exe).Path
          go test ./test/portable -v -count=1 -timeout 90s
